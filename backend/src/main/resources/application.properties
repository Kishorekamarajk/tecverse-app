# ===================================================================
# TEC-VERSE LOGIN AUTHENTICATION BACKEND CONFIGURATION
# ===================================================================

spring.application.name=tecverse-backend
server.port=${PORT:2303}

# ===================================================================
# PostgreSQL Database Connection (Uses existing database and table)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://10.184.48.20:5432/tecverse_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:NavyExam}

spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# Connection Pool (HikariCP) Configuration
# ===================================================================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# ===================================================================
# SMTP Mail Configuration for OTP Delivery (C-DAC SMTP Server)
# ===================================================================
spring.mail.host=${MAIL_HOST:smtp.cdac.in}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:tec-verse@cdac.in}
spring.mail.password=${MAIL_PASSWORD:Tecverse0212@#$}
spring.mail.protocol=${MAIL_PROTOCOL:smtp}


spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.mail.properties.mail.smtp.ssl.trust=*
tecverse.mail.console-fallback=true

# Logging
logging.level.com.tecverse.backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.mail=DEBUG

