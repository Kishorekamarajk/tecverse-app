name: Build iOS App on Mac Cloud

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build-ios:
    name: Compile & Package iOS App (.ipa)
    runs-on: macos-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. Install Flutter Dependencies
        run: flutter pub get

      - name: 4. Run Automated Tests
        run: flutter test

      - name: 5. Build iOS Release Application (No Codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: 6. Package Runner into Installable .ipa Payload
        run: |
          mkdir -p build/ios/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios
          zip -r tecverse_2026_ios.ipa Payload
          cd ../..

      - name: 7. Upload iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TEC-VERSE-2026-iOS-App
          path: build/ios/tecverse_2026_ios.ipa
          retention-days: 30
